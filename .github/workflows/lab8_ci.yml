
name: Spotify MLOps - Lab 8 CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  spotify-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Lab 7 pipeline
        run: python pipelines/run_lab7.py

      - name: Upload Lab 7 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotify-lab7-reports
          path: |
            reports/
            outputs/
            logs/
          if-no-files-found: warn
